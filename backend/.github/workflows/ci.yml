name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    # Runs every hook that's active in .pre-commit-config.yaml (gatekeepers,
    # gitleaks, detect-secrets, shellcheck, markdownlint, hadolint, black,
    # pyupgrade). flake8/bandit/pyright stay stages:[manual] as configured
    # there, so they do NOT run here.
    runs-on: ubuntu-latest
    env:
      # no-commit-to-branch only makes sense as a local git hook guarding
      # against direct commits; CI always checks out main/dev itself, so the
      # hook would fail unconditionally here.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: python -m pip freeze --local
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy  # pragma: allowlist secret
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/test_db  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t backend:ci .
